<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b132b"/>
      <stop offset="1" stop-color="#1c2541"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>
  <rect width="900" height="260" rx="16" fill="url(#grid)"/>

  <!-- top label -->
  <text x="40" y="52" font-family="Courier New, monospace" font-size="14" fill="#5bc0be" letter-spacing="4">// CONFIDENTIAL · SUPPORT DIVISION</text>

  <!-- title -->
  <text x="40" y="112" font-family="Courier New, monospace" font-size="44" font-weight="bold" fill="#ffffff">CASE FILE #11391</text>
  <text x="40" y="146" font-family="Courier New, monospace" font-size="20" fill="#9fb3c8">The Slow Ticket Investigation</text>

  <!-- heartbeat line -->
  <polyline points="40,205 160,205 190,205 210,170 235,240 260,190 280,205 460,205 490,205 510,160 535,245 560,185 580,205 860,205"
            fill="none" stroke="#5bc0be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
            stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="3s" repeatCount="indefinite"/>
  </polyline>

  <!-- stamp -->
  <g transform="rotate(-12 760 90)">
    <rect x="670" y="55" width="180" height="60" rx="8" fill="none" stroke="#e63946" stroke-width="4"/>
    <text x="760" y="95" text-anchor="middle" font-family="Courier New, monospace" font-size="26" font-weight="bold" fill="#e63946">SOLVED</text>
  </g>

  <!-- blinking dot -->
  <circle cx="850" cy="36" r="6" fill="#e63946">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
